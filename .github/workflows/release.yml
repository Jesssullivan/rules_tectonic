name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify signed immutable release carrier
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_RULESET_ID: "21844756"
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release: tag must be exact vMAJOR.MINOR.PATCH semver" >&2
            exit 64
          fi
          version="${BASH_REMATCH[1]}"

          ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}")"
          tag_object_type="$(jq -er '.object.type' <<<"${ref_json}")"
          tag_object_sha="$(jq -er '.object.sha' <<<"${ref_json}")"
          if [[ "${tag_object_type}" != "tag" ]]; then
            echo "release: ${RELEASE_TAG} is not an annotated tag object" >&2
            exit 65
          fi

          tag_json="$(gh api "repos/${GH_REPO}/git/tags/${tag_object_sha}")"
          jq -e '.verification.verified == true and .verification.reason == "valid"' \
            <<<"${tag_json}" >/dev/null
          signed_tag_name="$(jq -er '.tag' <<<"${tag_json}")"
          target_type="$(jq -er '.object.type' <<<"${tag_json}")"
          target_sha="$(jq -er '.object.sha' <<<"${tag_json}")"
          if [[ "${signed_tag_name}" != "${RELEASE_TAG}" || "${target_type}" != "commit" ]]; then
            echo "release: signed tag name or direct-commit target does not match the release ref" >&2
            exit 66
          fi

          commit_json="$(gh api "repos/${GH_REPO}/commits/${target_sha}")"
          jq -e '.commit.verification.verified == true and .commit.verification.reason == "valid"' \
            <<<"${commit_json}" >/dev/null
          canonical_main="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${target_sha}" != "${canonical_main}" ]]; then
            echo "release: signed tag target is not current canonical main" >&2
            exit 67
          fi

          # The workflow GITHUB_TOKEN cannot read admin-only bypass actors; GitHub redacts
          # that field to null. The operator/admin pre-tag gate proves exact [] and records
          # immutable-releases enabled=true without injecting an admin credential into CI.
          ruleset_json="$(gh api "repos/${GH_REPO}/rulesets/${TAG_RULESET_ID}")"
          jq -e '
            .target == "tag" and
            .enforcement == "active" and
            .conditions.ref_name.include == ["refs/tags/v*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | index("update")) != null and
            ([.rules[].type] | index("deletion")) != null
          ' <<<"${ruleset_json}" >/dev/null

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_object_sha=${tag_object_sha}" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact signed target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.version.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Bazelisk
        env:
          BAZELISK_VERSION: "1.29.0"
          BAZELISK_SHA256: "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992"
        run: |
          set -euo pipefail
          bazel_path="${RUNNER_TEMP}/bazel"
          curl -fsSLo "${bazel_path}" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64"
          printf '%s  %s\n' "${BAZELISK_SHA256}" "${bazel_path}" | sha256sum -c -
          chmod 0755 "${bazel_path}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Validate
        run: |
          set -euo pipefail
          bazel run //:buildifier.check
          bazel build //...
          bazel test //...
          bazel test //docs:defs_doc_test
          bazel build //examples:hello --output_groups=logs
          (cd e2e/bzlmod && bazel build //...)
          (cd e2e/bzlmod && bazel test //...)

      - name: Create source archive
        run: scripts/make-release-archive.sh "${{ steps.version.outputs.version }}" dist

      - name: Publish verified immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ steps.version.outputs.tag_object_sha }}
          EXPECTED_TARGET: ${{ steps.version.outputs.target_sha }}
          TAG_RULESET_ID: "21844756"
        run: |
          set -euo pipefail

          ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}")"
          actual_tag_object="$(jq -er '.object.sha' <<<"${ref_json}")"
          [[ "$(jq -er '.object.type' <<<"${ref_json}")" == "tag" ]]
          [[ "${actual_tag_object}" == "${EXPECTED_TAG_OBJECT}" ]]

          tag_json="$(gh api "repos/${GH_REPO}/git/tags/${actual_tag_object}")"
          jq -e '.verification.verified == true and .verification.reason == "valid"' \
            <<<"${tag_json}" >/dev/null
          [[ "$(jq -er '.tag' <<<"${tag_json}")" == "${RELEASE_TAG}" ]]
          [[ "$(jq -er '.object.type' <<<"${tag_json}")" == "commit" ]]
          [[ "$(jq -er '.object.sha' <<<"${tag_json}")" == "${EXPECTED_TARGET}" ]]

          commit_json="$(gh api "repos/${GH_REPO}/commits/${EXPECTED_TARGET}")"
          jq -e '.commit.verification.verified == true and .commit.verification.reason == "valid"' \
            <<<"${commit_json}" >/dev/null
          [[ "$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')" == "${EXPECTED_TARGET}" ]]

          ruleset_json="$(gh api "repos/${GH_REPO}/rulesets/${TAG_RULESET_ID}")"
          jq -e '
            .target == "tag" and
            .enforcement == "active" and
            .conditions.ref_name.include == ["refs/tags/v*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | index("update")) != null and
            ([.rules[].type] | index("deletion")) != null
          ' <<<"${ruleset_json}" >/dev/null

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "release: a release or draft already exists; refusing automatic mutation; inspect it explicitly" >&2
            exit 72
          fi

          archive="dist/rules_tectonic-${RELEASE_TAG}.tar.gz"
          archive_sha="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          gh release create "${RELEASE_TAG}" "${archive}" \
            --repo "${GH_REPO}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "${RELEASE_TAG}"

          draft_json="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}")"
          jq -e --arg tag "${RELEASE_TAG}" '.draft == true and .tag_name == $tag' \
            <<<"${draft_json}" >/dev/null
          asset_digest="$(jq -er --arg name "$(basename "${archive}")" '.assets[] | select(.name == $name) | .digest' \
            <<<"${draft_json}")"
          [[ "${asset_digest}" == "sha256:${archive_sha}" ]]

          final_ruleset_json="$(gh api "repos/${GH_REPO}/rulesets/${TAG_RULESET_ID}")"
          jq -e '
            .target == "tag" and
            .enforcement == "active" and
            .conditions.ref_name.include == ["refs/tags/v*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | index("update")) != null and
            ([.rules[].type] | index("deletion")) != null
          ' <<<"${final_ruleset_json}" >/dev/null

          final_ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}")"
          [[ "$(jq -er '.object.type' <<<"${final_ref_json}")" == "tag" ]]
          [[ "$(jq -er '.object.sha' <<<"${final_ref_json}")" == "${EXPECTED_TAG_OBJECT}" ]]
          [[ "$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')" == "${EXPECTED_TARGET}" ]]

          gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft=false
          published_json="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}")"
          jq -e --arg tag "${RELEASE_TAG}" \
            '.draft == false and .immutable == true and .tag_name == $tag' \
            <<<"${published_json}" >/dev/null
